<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141c1f">
<meta name="color-scheme" content="light">
<title>Owner manager</title>
<link rel="manifest" href="manager.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #edf1ee; --surface: #ffffff; --ink: #162024; --mute: #55666a; --line: #d2dad6; --row: #f5f7f5;
  --slate: #141c1f; --slate-2: #24333a; --chalk: #f4f2ea; --tag: #ffcf33; --tag-ink: #1d1a04;
  --tomato: #c42f1e; --tomato-bg: #fde6e2; --leaf: #1c7d45; --leaf-bg: #dff3e6;
  --display: Bahnschrift, 'DIN Alternate', 'Avenir Next Condensed', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #1d6fd1; outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; }

/* PIN gate */
.gate { min-height: 100%; display: grid; place-items: center; padding: 24px; background: var(--slate); color: var(--chalk); }
.gate form { width: min(380px, 100%); }
.gate h1 { font-size: 2.1rem; margin-bottom: 8px; }
.gate p { margin: 0 0 18px; color: #b9c6c8; }
.gate label { display: block; margin: 14px 0 4px; }
.gate input { width: 100%; height: 56px; text-align: center; letter-spacing: .6em; font: 1.9rem var(--display); background: #0e1416; color: var(--chalk); border: 1px solid #3b4e54; border-radius: 6px; }
.gate .err { color: #ff8a7f; min-height: 1.4em; margin: 10px 0 0; }
.gate .btn { width: 100%; height: 52px; margin-top: 8px; font-size: 1.1rem; }

.studio { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--slate); color: var(--chalk); display: flex; flex-direction: column; padding: 20px 14px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font: 700 1.35rem/1.15 var(--display); margin: 0 6px 2px; }
.brand-sub { margin: 0 6px 18px; color: #a9b8ba; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 10px 12px; border: 0; border-left: 4px solid transparent; border-radius: 0 6px 6px 0; background: none; color: #cfd9da; font: 600 1.05rem var(--display); }
.nav:hover { background: var(--slate-2); }
.nav[aria-current="page"] { background: var(--slate-2); border-left-color: var(--tag); color: #fff; }
.nav .count { background: var(--tag); color: var(--tag-ink); border-radius: 3px; padding: 0 7px; font-size: .85rem; }
.side-foot { margin-top: auto; padding-top: 20px; display: grid; gap: 8px; }
.export { min-height: 76px; padding: 10px 14px; border: 0; border-radius: 6px; background: var(--tag); color: var(--tag-ink); font: 700 1.2rem/1.15 var(--display); text-align: left; }
.export:hover { filter: brightness(1.06); }
.side .quiet { background: none; border: 1px solid #3b4e54; color: var(--chalk); border-radius: 6px; min-height: 40px; font-weight: 600; }
.side .quiet:hover { background: var(--slate-2); }
.side .lamp { margin: 6px 6px 0; color: #a9b8ba; font-size: .85rem; }

.view { padding: 26px 32px 60px; min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.view-head h1 { font-size: 1.9rem; }
.view-head p { margin: 4px 0 0; color: var(--mute); max-width: 68ch; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.tools input[type=search] { flex: 1 1 240px; max-width: 380px; }
.tools label { display: flex; align-items: center; gap: 6px; color: var(--mute); }
.tools .narrow { width: 76px; }
input:not([type=checkbox]):not([type=radio]), select, textarea { height: 40px; padding: 0 10px; border: 1px solid #b4c0bb; border-radius: 6px; background: #fff; }
textarea { height: auto; padding: 8px 10px; width: 100%; resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--slate); }
input[readonly] { background: var(--row); color: var(--mute); }

.btn { min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #b4c0bb; background: #fff; font-weight: 600; }
.btn:hover { background: var(--row); }
.btn.primary { background: var(--slate); border-color: var(--slate); color: #fff; }
.btn.primary:hover { background: var(--slate-2); }
.btn.tag { background: var(--tag); border-color: var(--tag); color: var(--tag-ink); }
.btn.danger { color: var(--tomato); }
.link { border: 0; background: none; padding: 4px 6px; color: #0f5fb8; font-weight: 600; border-radius: 4px; }
.link:hover { background: #e3edf9; }
.link.danger { color: var(--tomato); }
.link.danger:hover { background: var(--tomato-bg); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 600 .9rem var(--display); color: var(--mute); background: var(--row); white-space: nowrap; }
th button { border: 0; background: none; font: inherit; color: inherit; padding: 0; }
th button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.acts { text-align: right; white-space: nowrap; }
td.code { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
tr.is-low td { background: #fffaf0; }
/* Low-stock and status marks borrow the shelf-edge price tag. */
.tagmark { display: inline-block; padding: 1px 8px; border-radius: 2px; font: 700 .82rem var(--display); background: var(--tag); color: var(--tag-ink); }
.tagmark.bad { background: var(--tomato); color: #fff; }
.tagmark.good { background: var(--leaf-bg); color: var(--leaf); }
.tagmark.plain { background: #e6ebe8; color: var(--mute); }
.empty { padding: 36px 20px; background: var(--surface); border: 1px dashed #b4c0bb; border-radius: 6px; color: var(--mute); text-align: center; margin: 0; }
s.was { color: var(--tomato); margin-right: 6px; }

.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; margin: 0 0 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.ledger div { padding: 16px 18px; border-right: 1px solid var(--line); }
.ledger div:last-child { border-right: 0; }
.ledger dt { color: var(--mute); }
.ledger dd { margin: 2px 0 0; font: 700 1.9rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.ledger small { display: block; color: var(--mute); font: 400 .88rem var(--body); margin-top: 2px; }
.ledger .warn dd { color: var(--tomato); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 26px; }
.cols h2 { font-size: 1.2rem; margin-bottom: 10px; }
.plain-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.plain-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.plain-list li:last-child { border-bottom: 0; }
.steps { margin: 0; padding-left: 1.3em; max-width: 62ch; }
.steps li { margin-bottom: 6px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; max-width: 760px; }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting strong { display: block; font: 600 1.08rem var(--display); }
.setting span { color: var(--mute); }
.setting.tall { grid-template-columns: 1fr; }
.toggle { width: 56px; height: 30px; border-radius: 15px; border: 1px solid #b4c0bb; background: #e6ebe8; position: relative; padding: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: left .12s; }
.toggle[aria-checked="true"] { background: var(--leaf); border-color: var(--leaf); }
.toggle[aria-checked="true"]::after { left: 29px; }
details.note { margin-top: 18px; max-width: 760px; color: var(--mute); }
details.note summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.note pre { background: var(--slate); color: var(--chalk); padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: .85rem; }

dialog.dlg { width: min(540px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
dialog.dlg::backdrop { background: rgba(20, 28, 31, .6); }
.dlg h2 { font-size: 1.45rem; margin-bottom: 12px; }
.dlg p { margin: 0 0 12px; }
.dlg .field { margin-bottom: 14px; }
.dlg .field > label { display: block; font-weight: 600; margin-bottom: 4px; }
.dlg .field input:not([type=checkbox]), .dlg .field select { width: 100%; }
.dlg .field.check > label { display: flex; align-items: center; gap: 8px; }
.dlg .hint { display: block; color: var(--mute); font-size: .9rem; margin-top: 4px; }
.dlg .err { color: var(--tomato); min-height: 1.3em; margin: 6px 0 0; font-weight: 600; }
.dlg-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 18px; }
#pinInput { letter-spacing: .6em; text-align: center; font: 1.7rem var(--display); height: 52px; width: 100%; }

.join { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; margin-bottom: 18px; background: #fff6d2; border: 2px solid var(--tag); border-radius: 6px; }
.join p { margin: 0; flex: 1 1 300px; }
.panel-title { font-size: 1.2rem; margin: 28px 0 10px; }
.hostcode { font: 700 1.3rem var(--display); letter-spacing: .08em; }
.gate .waitnote { color: var(--tag); margin: 14px 0 0; }
.fieldlist { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.fieldrow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 70px; gap: 8px; align-items: center; }
.fieldrow input { width: 100%; }
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 40; display: grid; gap: 8px; max-width: min(460px, calc(100vw - 48px)); }
.toast { padding: 12px 16px; border-radius: 6px; background: var(--slate); color: var(--chalk); font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); border-left: 6px solid #a9b8ba; }
.toast.good { border-left-color: #5fd487; }
.toast.bad { border-left-color: #ff6b5e; }
.veil { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 28, 31, .88); color: var(--chalk); border: 4px dashed var(--tag); font: 700 1.6rem var(--display); pointer-events: none; }

@media (max-width: 860px) {
  .studio { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 14px; }
  .brand-sub { margin-bottom: 10px; }
  .side ul { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav { white-space: nowrap; border-left: 0; border-bottom: 4px solid transparent; border-radius: 6px 6px 0 0; gap: 8px; }
  .nav[aria-current="page"] { border-bottom-color: var(--tag); }
  .side-foot { margin-top: 12px; padding-top: 0; grid-template-columns: 1fr 1fr; }
  .export { grid-column: 1 / -1; min-height: 56px; }
  .side .lamp { display: none; }
  .view { padding: 20px 14px 60px; }
  .ledger div { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .toggle::after { transition: none; } }
@media print { .side, .toasts, .tools, td.acts, th.acts { display: none !important; } .studio { display: block; } }
</style>
</head>
<body>

<div id="gate" class="gate">
  <form id="gateForm" autocomplete="off">
    <h1 id="gateTitle">Owner manager</h1>
    <p id="gateLead"></p>
    <label for="gatePin" id="gatePinLabel">4-digit PIN</label>
    <input id="gatePin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
    <div id="gateAgain" hidden>
      <label for="gatePin2">Type the PIN again</label>
      <input id="gatePin2" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}">
    </div>
    <p id="gateErr" class="err" role="alert"></p>
    <button class="btn tag" id="gateBtn">Unlock</button>
    <p id="gateWait" class="waitnote" hidden></p>
  </form>
</div>

<div id="studio" class="studio" hidden>
  <nav class="side" aria-label="Sections">
    <p class="brand">Owner manager</p>
    <p class="brand-sub" id="storeName"></p>
    <ul id="navList"></ul>
    <div class="side-foot">
      <button type="button" class="export" id="exportBtn">Compile &amp; Export Sync File</button>
      <button type="button" class="quiet" id="importBtn">Import a sync file</button>
      <button type="button" class="quiet" id="lockBtn">Lock</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <p class="lamp" id="hostLamp" hidden></p>
      <p class="lamp" id="offlineLamp" hidden>Works offline on this computer</p>
    </div>
  </nav>
  <main class="view" id="view"></main>
</div>

<div id="dropVeil" class="veil" hidden>Release to import the sync file</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<dialog id="formDlg" class="dlg"><form novalidate>
  <h2 id="formTitle"></h2>
  <p id="formLead" hidden></p>
  <div id="formFields"></div>
  <p id="formErr" class="err" role="alert"></p>
  <div class="dlg-btns"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="formOk">Save</button></div>
</form></dialog>

<dialog id="askDlg" class="dlg"><form method="dialog">
  <h2 id="askTitle"></h2><div id="askBody"></div><div id="askBtns" class="dlg-btns"></div>
</form></dialog>

<dialog id="pinDlg" class="dlg"><form autocomplete="off">
  <h2 id="pinTitle"></h2>
  <div class="field"><label for="pinInput">4-digit PIN</label>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></div>
  <p id="pinErr" class="err" role="alert"></p>
  <div class="dlg-btns"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Continue</button></div>
</form></dialog>

<script>
/* ===== Shared core. This block is identical in checkout_terminal.html and owner_manager.html ===== */
const Core = (() => {
  'use strict';

  /* ---------- money and dates (all arithmetic in integer cents) ---------- */
  const toCents = v => { const n = Math.round(Number(v) * 100); return Number.isFinite(n) ? n : 0; };
  const toMoney = c => Math.round(c) / 100;
  const fmt = c => (c < 0 ? '-$' : '$') + (Math.abs(c) / 100).toFixed(2);
  const pad2 = n => String(n).padStart(2, '0');
  const isoDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const addDays = (iso, days) => { const [y, m, d] = iso.split('-').map(Number); return isoDate(new Date(y, m - 1, d + days)); };
  const phoneKey = s => String(s ?? '').replace(/\D/g, '');
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

  /* ---------- SHA-256 in plain JS, so PIN checks work without a secure context ---------- */
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const W = new Uint32Array(64);
  const encoder = new TextEncoder();
  function sha256(str) {
    const bytes = encoder.encode(str), len = bytes.length;
    const total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(bytes); buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, Math.floor(len / 0x20000000)); dv.setUint32(total - 4, (len << 3) >>> 0);
    const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const x = W[i - 15], y = W[i - 2];
        const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], hh = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const t1 = (hh + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += hh;
    }
    let out = ''; for (const x of H) out += x.toString(16).padStart(8, '0');
    return out;
  }

  /* ---------- PIN: salted, stretched SHA-256 stored as "s256$rounds$salt$digest" ---------- */
  const PIN_ROUNDS = 12000;
  const randomHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
  function hashPin(pin, salt = randomHex(16), rounds = PIN_ROUNDS) {
    let d = sha256(`${salt}:${pin}`);
    for (let i = 1; i < rounds; i++) d = sha256(d + salt);
    return `s256$${rounds}$${salt}$${d}`;
  }
  function verifyPin(pin, stored) {
    const [tag, rounds, salt, digest] = String(stored ?? '').split('$');
    if (tag !== 's256' || !digest || !(Number(rounds) > 0) || Number(rounds) > 200000) return false;
    return hashPin(String(pin), salt, Number(rounds)) === stored;
  }
  /* Wrong-PIN guard: every fifth miss on this device adds a 30 second wait. */
  const GUARD_KEY = 'pos.pin.guard';
  function tryPin(pin, stored) {
    let g = {}; try { g = JSON.parse(localStorage.getItem(GUARD_KEY)) || {}; } catch { /* fresh guard */ }
    const now = Date.now();
    if (g.until > now) return { ok: false, wait: Math.ceil((g.until - now) / 1000) };
    if (verifyPin(pin, stored)) { try { localStorage.removeItem(GUARD_KEY); } catch { /* ignore */ } return { ok: true }; }
    const fails = (g.fails || 0) + 1;
    const until = fails % 5 === 0 ? now + 30000 * (fails / 5) : 0;
    try { localStorage.setItem(GUARD_KEY, JSON.stringify({ fails, until })); } catch { /* ignore */ }
    return { ok: false, wait: until ? Math.ceil((until - now) / 1000) : 0 };
  }

  /* ---------- schema ---------- */
  const PROMO_TYPES = ['percentage', 'fixed', 'clearance'];
  /* Items sold by weight: the price is per one of these units. */
  const GRAMS = { lb: 453.59237, kg: 1000, oz: 28.349523125, g: 1 };
  const round3 = n => Math.round(n * 1000) / 1000;
  const convertWeight = (value, from, to) => round3(value * GRAMS[from] / GRAMS[to]);
  /* What the owner asks for when an account is opened. The phone number is the account number and is always asked.
     use: 'off' (not asked), 'optional', or 'required'. Fields the owner adds get ids starting with "x_". */
  const ACCOUNT_PRESETS = [['name', 'Full name', 'required'], ['first_name', 'First name', 'off'], ['last_name', 'Last name', 'off'],

  /* ---------- Wi-Fi sync: this page as the host ----------
     Registers connect over the shop Wi-Fi. The host keeps the one true copy: it applies each reported sale once (by id)
     to stock and balances, and sends the result, plus every owner change, back out to all registers. */
  const K_HOST = 'pos.host';
  const Host = (() => {
    const { Link } = Core;
    let cfg; try { cfg = JSON.parse(localStorage.getItem(K_HOST)); } catch { cfg = null; }
    cfg = { enabled: false, id: Link.rid(10), name: '', links: {}, ...(cfg && typeof cfg === 'object' ? cfg : {}) };
    const persist = () => localStorage.setItem(K_HOST, JSON.stringify(cfg));
    const peers = new Map(), waiting = new Map();
    let stop = null, up = false, run = 0, lastHello = 0, offers = [], queue = Promise.resolve();
    const serial = job => (queue = queue.then(job).catch(e => console.warn('Wi-Fi sync', e)));
    const hostName = () => cfg.name || (DB?.settings.receipt_header || '').split(/\r?\n/)[0].trim() || 'Shop host';
    const bare = () => { const { _pending, ...core } = DB; return core; };

    function paint() {
      const n = waiting.size;
      $('gateWait').hidden = !n; $('gateWait').textContent = n ? `${n} register${n === 1 ? ' is' : 's are'} waiting to join. Unlock to answer.` : '';
      $('hostLamp').hidden = !cfg.enabled;
      $('hostLamp').textContent = up ? `Wi-Fi sync on, ${peers.size} register${peers.size === 1 ? '' : 's'} connected` : 'Wi-Fi sync: link service out of reach';
      if (unlocked && !document.querySelector('dialog[open]')) renderAll();
    }
    async function start() {
      const mine = ++run;
      stop?.(); stop = null; up = false;
      if (!cfg.enabled) return paint();
      let area = null; try { area = await Link.areaTopic(); } catch { /* registers can still type the host code */ }
      if (mine !== run) return;
      stop = Link.subscribe(['gpos-h-' + cfg.id, 'gpos-c-' + cfg.id.slice(0, 8), ...(area ? [area] : [])], m => { onSignal(m).catch(() => {}); }, ok => {
        up = ok; paint();
        if (ok && Date.now() - lastHello > 600000) { lastHello = Date.now(); Link.publish('gpos-u-' + cfg.id, { t: 'up' }).catch(() => {}); }   // wakes registers that are waiting to retry
      });
      paint();
    }
    async function onSignal(m) {
      if (typeof m.reply !== 'string' || !/^gpos-r-[0-9a-f]{24}$/.test(m.reply)) return;
      if (m.t === 'who') return Link.publish(m.reply, { t: 'host', id: cfg.id, name: hostName() });
      if (m.t !== 'offer' || typeof m.sdp !== 'string' || m.sdp.length > 4000) return;
      const now = Date.now(); offers = offers.filter(t => now - t < 60000);
      if (offers.length >= 20) return;                     // more than 20 connection attempts a minute is not a shop
      offers.push(now);
      const a = await Link.answer(m.sdp);
      const peer = { pc: a.pc, station: '', authed: false, nonce: Link.rid(8) };
      const giveUp = setTimeout(() => { try { a.pc.close(); } catch { /* closed */ } }, 30000);
      a.channel.then(dc => { clearTimeout(giveUp); peer.wire = Link.wire(dc, msg => serial(() => fromRegister(peer, msg)), () => drop(peer)); });
      await Link.publish(m.reply, { t: 'answer', sdp: a.sdp });
    }
    function drop(peer) {
      if (peers.get(peer.station) === peer) peers.delete(peer.station);
      if (waiting.get(peer.station) === peer) waiting.delete(peer.station);
      peer.wire?.close(); try { peer.pc.close(); } catch { /* closed */ }
      paint();
    }
    function admit(peer) {
      const old = peers.get(peer.station); if (old && old !== peer) drop(old);
      peer.authed = true; peers.set(peer.station, peer);
      peer.wire.send({ t: 'ready' }); paint();
    }
    async function fromRegister(peer, m) {
      if (m.t === 'hello') {
        peer.station = String(m.station || '').replace(/[^\w-]/g, '').slice(0, 24); peer.code = String(m.code || '').replace(/\D/g, '').slice(0, 4);
        if (!peer.station) return drop(peer);
        const known = cfg.links[peer.station];
        if (known && m.linked) return peer.wire.send({ t: 'welcome', nonce: peer.nonce, proof: Link.proof(known.key, String(m.nonce), 'host') });
        const earlier = waiting.get(peer.station); if (earlier && earlier !== peer) drop(earlier);
        waiting.set(peer.station, peer); peer.wire.send({ t: 'wait' }); return paint();        // the owner decides
      }
      if (m.t === 'auth') {
        const known = cfg.links[peer.station];
        return known && m.proof === Link.proof(known.key, peer.nonce, 'register') ? admit(peer) : drop(peer);
      }
      if (!peer.authed) return;
      if (m.t === 'state') {
        const theirs = Core.stampOf({ settings: { last_modified: String(m.stamp || '') } });
        if (theirs > Core.stampOf(DB)) return peer.wire.send({ t: 'need', what: 'full' });      // the register holds newer owner data than this host
        await takeSales(peer, m.pending, true);
        if (m.first) peer.wire.send({ t: 'need', what: 'history' });
      } else if (m.t === 'sales') await takeSales(peer, m.pending, true);
      else if (m.t === 'history') await takeSales(peer, m.sales, false, true);
      else if (m.t === 'full') {
        const { db } = Core.normalizeDb({ ...m.core, sales_history: Array.isArray(m.sales) ? m.sales : [] });
        const queued = new Set(Array.isArray(m.pending) ? m.pending : []);
        if (!(Core.stampOf(db) > Core.stampOf(DB))) return takeSales(peer, db.sales_history.filter(r => queued.has(r.id)), true);
        db.settings.pin_hash = DB.settings.pin_hash; freezeOverdue(db);                          // newest timestamp wins: adopt it and pass it on
        DB = await Store.replace(db); SALES = await Store.allSales();
        send(peer, [...queued]); broadcast(peer); paint();
      }
    }
    /* Stores sales this host has not seen. With apply, their effect on stock and balances is applied exactly once. */
    async function takeSales(peer, list, apply, quiet) {
      const recs = (Array.isArray(list) ? list : []).filter(r => r && typeof r === 'object' && typeof r.id === 'string' && r.id).slice(0, 20000);
      const unseen = await Store.missing(recs.map(r => r.id)), fresh = recs.filter(r => unseen.has(r.id));
      if (fresh.length) {
        DB = await Store.update(core => { for (const r of fresh) if (apply || r.type === 'account_open') Core.applyRecord(core, r); freezeOverdue(core); }, fresh);
        SALES = await Store.allSales();
      }
      if (quiet) return paint();
      send(peer, recs.map(r => r.id));
      if (fresh.length) { broadcast(peer); paint(); }
    }
    const send = (peer, acked) => peer.wire.send({ t: 'core', core: bare(), acked });
    function broadcast(except) { if (!DB) return; for (const peer of peers.values()) if (peer !== except) send(peer, []); }

    function allow(peer) {
      if (waiting.get(peer.station) !== peer) return;
      waiting.delete(peer.station);
      const key = Link.rid(24); cfg.links[peer.station] = { key, added: new Date().toISOString() }; persist();
      peer.wire.send({ t: 'linked', key, host: { id: cfg.id, name: hostName() } });
      admit(peer); toast(`${peer.station} is now linked.`, 'good');
    }
    function refuse(peer) { peer.wire.send({ t: 'refused' }); setTimeout(() => drop(peer), 300); waiting.delete(peer.station); paint(); }
    const requests = () => [...waiting.values()].map(peer => h('div', { class: 'join', role: 'alert' },
      h('p', {}, h('strong', { text: `Register ${peer.station} wants to join. ` }), `Allow it only if its screen shows code ${peer.code || '(none)'}.`),
      h('button', { type: 'button', class: 'btn primary', text: 'Allow', onclick: () => allow(peer) }),
      h('button', { type: 'button', class: 'btn', text: 'Refuse', onclick: () => refuse(peer) })));

    function settings(row) {
      const rows = [row('Wi-Fi sync', 'Registers on the same Wi-Fi send their sales here and pick up your changes on their own. Keep this page open on this computer. Finding each other uses the internet for a moment; shop data only travels over your Wi-Fi.',
        h('button', { type: 'button', class: 'toggle', role: 'switch', 'aria-checked': String(cfg.enabled), 'aria-label': 'Wi-Fi sync',
          onclick: () => { cfg.enabled = !cfg.enabled; persist(); if (!cfg.enabled) for (const peer of [...peers.values(), ...waiting.values()]) drop(peer); start(); } }))];
      if (cfg.enabled) {
        const stations = Object.keys(cfg.links);
        rows.push(
          row('Host name', 'What staff see when a register looks for its host.', h('input', { id: 'hostName', maxlength: '40', 'aria-label': 'Host name', value: hostName(), onchange: e => { cfg.name = e.target.value.trim(); persist(); toast('Saved.', 'good'); } })),
          row('Host code', 'A register that cannot see this host on its own can be given this code.', h('strong', { class: 'hostcode', text: Link.prettyCode(cfg.id) })),
          row('Linked registers', stations.length ? 'Each one was allowed once on this screen. Remove one to make it ask again.' : 'None yet. Open the checkout page on a register; it asks for its host, and the request appears here.',
            stations.length ? h('ul', { class: 'plain-list' }, stations.map(st => h('li', {},
              h('span', {}, st, ' ', h('span', { class: 'tagmark ' + (peers.has(st) ? 'good' : 'plain'), text: peers.has(st) ? 'Connected' : 'Away' })),
              link('Remove', () => { const peer = peers.get(st); delete cfg.links[st]; persist(); if (peer) drop(peer); else paint(); }, true)))) : null, true));
      }
      return [h('h2', { class: 'panel-title', text: 'Registers on other computers' }), h('div', { class: 'panel' }, rows)];
    }
    return { start, broadcast: () => broadcast(), requests, settings };
  })();

  async function importFiles(files) {
    if (!unlocked || document.querySelector('dialog[open]')) return;
    let incoming;
    try { incoming = await readDbFiles(files); } catch (e) { return toast(e.message, 'bad'); }
    const next = incoming.db, count = o => Object.keys(o).length;
    const blank = !count(DB.inventory) && !count(DB.customers) && !count(DB.promotions);
    let mode = 'replace';
    if (!blank) {
      mode = await ask({
        title: 'How should this file be imported?',
        body: [`The file holds ${count(next.inventory)} items, ${count(next.customers)} customers and ${next.sales_history.length} sales records.`,
          h('p', {}, h('strong', { text: 'Pull register activity ' }), 'takes stock counts, customer balances, new accounts and sales from the file. Your prices, promotions, devices and settings stay as they are here.'),
          h('p', {}, h('strong', { text: 'Replace everything ' }), 'makes this manager a copy of the file. Your PIN stays.')],
        buttons: [{ label: 'Cancel', cancel: true }, { label: 'Replace everything', value: 'replace' }, { label: 'Pull register activity', value: 'pull', kind: 'primary' }]
      });
      if (!mode) return;
    }
    if (!(await askPin('Enter your PIN to import this file'))) return;
    try {
      if (mode === 'pull') {
        DB = await Store.update(core => {
          for (const [code, it] of Object.entries(next.inventory)) if (has(core.inventory, code) && core.inventory[code].stock !== null && it.stock !== null) core.inventory[code].stock = it.stock;
          for (const [ph, c] of Object.entries(next.customers)) {
            if (has(core.customers, ph)) Object.assign(core.customers[ph], { balance_due: c.balance_due, due_date: c.due_date, status: c.status });
            else core.customers[ph] = c;                                                    // an account opened at the register
          }
          Core.stampNow(core); freezeOverdue(core);
        }, next.sales_history);
      } else {
        next.settings.pin_hash = DB.settings.pin_hash;
        Core.stampNow(next); freezeOverdue(next);
        DB = await Store.replace(next);
      }
      SALES = await Store.allSales();
    } catch (e) { return toast(`The import could not be saved: ${e.message}`, 'bad'); }
    renderAll(); Host.broadcast();
    toast(`Imported${incoming.skipped.length ? `, ${incoming.skipped.length} bad rows skipped` : ''}.`, 'good');
  }
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) importFiles(files); });
  const carriesFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (unlocked && carriesFiles(e)) { e.preventDefault(); dragDepth++; $('dropVeil').hidden = false; } });
  window.addEventListener('dragover', e => { if (carriesFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('dropVeil').hidden = true; } });
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('dropVeil').hidden = true; if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files); });

  /* ---------- PIN gate ---------- */
  function showGate() {
    unlocked = false;
    const fresh = !DB?.settings.pin_hash;
    $('studio').hidden = true; $('gate').hidden = false; $('view').replaceChildren();
    $('gateTitle').textContent = fresh ? 'Set your system PIN' : 'Owner manager';
    $('gateLead').textContent = fresh ? 'Choose a 4-digit PIN. It unlocks this manager, authorises every export, and is what a register asks for before it loads your data.' : 'Enter your PIN to open the manager.';
    $('gatePinLabel').textContent = fresh ? 'New 4-digit PIN' : '4-digit PIN';
    $('gateAgain').hidden = !fresh; $('gatePin2').required = fresh;
    $('gateBtn').textContent = fresh ? 'Set PIN and open' : 'Unlock';
    $('gatePin').value = $('gatePin2').value = ''; $('gateErr').textContent = '';
    $('gatePin').focus();
  }
  $('gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('gatePin').value;
    try {
      if (!DB?.settings.pin_hash) {
        if (!/^\d{4}$/.test(pin)) return void ($('gateErr').textContent = 'The PIN is exactly 4 digits.');
        if (pin !== $('gatePin2').value) return void ($('gateErr').textContent = 'The two PINs do not match.');
        DB = await Store.update(c => { if (!c.settings.pin_hash) c.settings.pin_hash = hashPin(pin); });
        if (!tryPin(pin, DB.settings.pin_hash).ok) return showGate();   // another tab set a PIN first
      } else {
        const r = tryPin(pin, DB.settings.pin_hash);
        if (!r.ok) { $('gatePin').value = ''; return void ($('gateErr').textContent = r.wait ? `Too many wrong tries. Wait ${r.wait} seconds, then try again.` : 'That PIN is not right.'); }
      }
      if (needsFreeze(DB)) DB = await Store.update(freezeOverdue);
      SALES = await Store.allSales();
      unlocked = true; $('gate').hidden = true; $('studio').hidden = false; renderAll();
    } catch (err) { $('gateErr').textContent = `Local storage is unavailable: ${err.message}`; }
  });
  $('lockBtn').addEventListener('click', showGate);

  window.addEventListener('unhandledrejection', e => toast(`That did not save: ${e.reason?.message || e.reason}`, 'bad'));
  async function start() {
    try { DB = (await Store.load()) || (() => { const { sales_history, ...core } = emptyDb(); return core; })(); }
    catch (e) { DB = null; $('gateErr').textContent = `Local storage is unavailable: ${e.message}`; }
    showGate(); Host.start();
    Store.onChange(async () => {
      try { const fresh = await Store.load(); if (!fresh) return; DB = fresh; Host.broadcast(); if (unlocked) { SALES = await Store.allSales(); if (!document.querySelector('dialog[open]')) renderAll(); } } catch { /* keep the last good copy */ }
    });
    registerOffline().then(ok => { $('offlineLamp').hidden = !ok; });
  }
  start();
})();
</script>
</body>
</html>
